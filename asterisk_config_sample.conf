; ================================================================
; Asterisk Dialplan Configuration for Outbound Calling Bot
; ================================================================
; This file should be added to /etc/asterisk/extensions.conf
; or included via: #include asterisk_config_sample.conf

; ================================================================
; OUTBOUND CAMPAIGN CONTEXT
; ================================================================
; This context handles outbound calls initiated by the calling bot
; It plays a greeting, captures DTMF input, and triggers events

[outbound_campaign]

; Main call flow
exten => _X.,1,NoOp(*** Starting Outbound Campaign Call ***)
    ; Log the campaign ID from caller ID
    same => n,Set(CAMPAIGN_ID=${CALLERID(num)})
    same => n,Set(CONTACT_ID=${EXTEN})
    
    ; Answer the call
    same => n,Answer()
    same => n,Wait(1)
    
    ; Record call start time
    same => n,Set(CALL_START=${EPOCH})
    
    ; Play welcome message
    ; Option 1: Use a custom sound file
    ; same => n,Playback(custom/campaign-welcome)
    
    ; Option 2: Use text-to-speech (requires festival or similar)
    ; same => n,Festival("Hello, this is a general call. To proceed press 1, otherwise press 2 to decline")
    
    ; Option 3: Use default Asterisk sounds (for testing)
    same => n,Playback(hello-world)
    same => n,Playback(press-1)
    
    ; Read DTMF input
    ; Read(variable,filename,maxdigits,options,attempts,timeout)
    ; - Reads 1 digit
    ; - Gives 5 seconds timeout
    ; - Plays 'beep' sound before reading
    same => n,Read(DTMF_RESPONSE,beep,1,,1,5)
    
    ; Log the response
    same => n,NoOp(Customer DTMF Response: ${DTMF_RESPONSE})
    
    ; Record call end time and calculate duration
    same => n,Set(CALL_END=${EPOCH})
    same => n,Set(CALL_DURATION=$[${CALL_END} - ${CALL_START}])
    
    ; Send custom UserEvent for the application to capture
    ; This event will be caught by the AMI event listener
    same => n,UserEvent(CALL_RESPONSE,CampaignID:${CAMPAIGN_ID},ContactID:${CONTACT_ID},DTMF:${DTMF_RESPONSE},Duration:${CALL_DURATION},Uniqueid:${UNIQUEID})
    
    ; Handle different DTMF responses
    same => n,GotoIf($["${DTMF_RESPONSE}" = "1"]?accepted:rejected)
    
    ; Customer pressed 1 (Accepted)
    same => n(accepted),Playback(thank-you-cooperation)
    same => n,Goto(hangup)
    
    ; Customer pressed 2 or other (Rejected)
    same => n(rejected),Playback(goodbye)
    same => n,Goto(hangup)
    
    ; Hangup the call
    same => n(hangup),Hangup()

; Timeout handler (if customer doesn't press any button)
exten => t,1,NoOp(Call Timeout - No DTMF received)
    same => n,Playback(goodbye)
    same => n,UserEvent(CALL_RESPONSE,CampaignID:${CAMPAIGN_ID},ContactID:${CONTACT_ID},DTMF:timeout,Duration:0,Uniqueid:${UNIQUEID})
    same => n,Hangup()

; Invalid extension handler
exten => i,1,NoOp(Invalid Extension)
    same => n,Playback(invalid)
    same => n,Goto(outbound_campaign,${EXTEN},1)

; ================================================================
; ALTERNATIVE IMPLEMENTATION WITH MENU
; ================================================================
; This provides a more interactive IVR experience

[outbound_campaign_ivr]

exten => _X.,1,NoOp(*** IVR Campaign Call ***)
    same => n,Set(CAMPAIGN_ID=${CALLERID(num)})
    same => n,Answer()
    same => n,Wait(1)
    
    ; Set up retry counter
    same => n,Set(RETRY_COUNT=0)
    
    ; Main menu
    same => n(menu),Background(custom/main-menu)  ; "Press 1 to proceed, 2 to decline"
    same => n,WaitExten(5)
    
    ; If no response after 5 seconds
    same => n,Set(RETRY_COUNT=$[${RETRY_COUNT} + 1])
    same => n,GotoIf($[${RETRY_COUNT} < 3]?menu:timeout)
    
    same => n(timeout),Playback(goodbye)
    same => n,Hangup()

; Handle option 1 (Accept)
exten => 1,1,NoOp(Customer Pressed 1 - Accept)
    same => n,Set(DTMF_RESPONSE=1)
    same => n,UserEvent(CALL_RESPONSE,CampaignID:${CAMPAIGN_ID},DTMF:1,Uniqueid:${UNIQUEID})
    same => n,Playback(thank-you-cooperation)
    same => n,Hangup()

; Handle option 2 (Decline)
exten => 2,1,NoOp(Customer Pressed 2 - Decline)
    same => n,Set(DTMF_RESPONSE=2)
    same => n,UserEvent(CALL_RESPONSE,CampaignID:${CAMPAIGN_ID},DTMF:2,Uniqueid:${UNIQUEID})
    same => n,Playback(goodbye)
    same => n,Hangup()

; ================================================================
; ADVANCED IMPLEMENTATION WITH RECORDING
; ================================================================
; This version also records the call for quality assurance

[outbound_campaign_recorded]

exten => _X.,1,NoOp(*** Recorded Campaign Call ***)
    same => n,Set(CAMPAIGN_ID=${CALLERID(num)})
    same => n,Set(CONTACT_ID=${EXTEN})
    same => n,Answer()
    same => n,Wait(1)
    
    ; Start call recording
    ; Format: MixMonitor(filename,options,command)
    same => n,Set(RECORDING_FILE=/var/spool/asterisk/monitor/campaign_${CAMPAIGN_ID}_${UNIQUEID}.wav)
    same => n,MixMonitor(${RECORDING_FILE},b)
    
    ; Play greeting and capture DTMF
    same => n,Playback(hello-world)
    same => n,Read(DTMF_RESPONSE,beep,1,,1,5)
    same => n,NoOp(DTMF Response: ${DTMF_RESPONSE})
    
    ; Stop recording
    same => n,StopMixMonitor()
    
    ; Send event with recording file path
    same => n,UserEvent(CALL_RESPONSE,CampaignID:${CAMPAIGN_ID},ContactID:${CONTACT_ID},DTMF:${DTMF_RESPONSE},Recording:${RECORDING_FILE},Uniqueid:${UNIQUEID})
    
    ; Thank customer and hangup
    same => n,Playback(thank-you-cooperation)
    same => n,Hangup()

; ================================================================
; INSTALLATION INSTRUCTIONS
; ================================================================
; 
; 1. Copy this configuration to Asterisk:
;    sudo nano /etc/asterisk/extensions_callbot.conf
;    Paste the contents above
;
; 2. Include this file in main extensions.conf:
;    sudo nano /etc/asterisk/extensions.conf
;    Add this line at the bottom:
;    #include extensions_callbot.conf
;
; 3. Reload dialplan:
;    asterisk -rx "dialplan reload"
;
; 4. Verify configuration:
;    asterisk -rx "dialplan show outbound_campaign"
;
; 5. Test the dialplan:
;    asterisk -rx "console dial 1234567890@outbound_campaign"
;
; ================================================================
; CUSTOM SOUND FILES
; ================================================================
; 
; To create custom sound files for your campaign:
;
; 1. Record your message as WAV file (8kHz, 16-bit, mono)
;
; 2. Convert to proper format:
;    sox input.wav -r 8000 -c 1 -e signed-integer output.wav
;
; 3. Copy to Asterisk sounds directory:
;    sudo cp output.wav /var/lib/asterisk/sounds/custom/
;
; 4. Reference in dialplan:
;    Playback(custom/output)
;
; ================================================================
; DTMF CONFIGURATION
; ================================================================
; 
; Ensure your SIP trunk is configured for RFC2833 DTMF:
; 
; In /etc/asterisk/sip.conf:
; [general]
; dtmfmode=rfc2833
;
; Or in /etc/asterisk/pjsip.conf:
; [transport-udp]
; dtmf_mode=rfc4733
;
; ================================================================
